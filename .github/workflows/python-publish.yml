# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10","3.11", "3.12", "3.13"]  # Параметры для перебора

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build release distributions
        run: |
          git submodule update --init 
          python -m pip install build auditwheel 
          python -m build
          python -m auditwheel repair dist/*.whl -w dist
          rm dist/*-linux_x86*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.python }}
          path: dist/
  
  release-build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10","3.11", "3.12", "3.13"]  # Параметры для перебора

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build release distributions
        run: |
          git submodule update --init 
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.python }}
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build-linux
      - release-build-windows
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/YOURPROJECT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/
      - name: Display structure of downloaded files
        run: ls -R
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/
